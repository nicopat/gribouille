<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1c1c">
<meta name="description" content="Gribouille, le jeu de dessin en famille : tire un mot, dessine sur papier, le minuteur tourne.">
<title>Gribouille</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23e8b64a'/></svg>">
<style>
  :root {
    --bg: #1f1c1c;
    --surface: #2a2625;
    --surface-2: #3a3331;
    --text: #f7efe9;
    --muted: #c4b8b1;
    --primary: #e8b64a;
    --primary-text: #1f1c1c;
    --accent: #a9c9b0;
    --accent-text: #1f1c1c;
    --green: #8fbf9a;
    --danger: #ff7d70;
    --border: #4a423f;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    --easy: #a9c9b0;
    --medium: #e8b64a;
    --hard: #ef9f97;
    --tab-on: #1f1c1c;
    --blob-1: #3d302e;
    --blob-2: #2c3439;
    --blob-3: #3b3326;
    --focus: #e48ab0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    transition: background-color .35s ease, color .35s ease;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, [role="switch"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    gap: 12px;
  }

  /* ---------- Haut ---------- */
  .top { display: flex; align-items: center; gap: 8px; }
  .tabs {
    flex: 1;
    display: flex;
    background: var(--surface-2);
    border-radius: 16px;
    padding: 4px;
    gap: 4px;
    min-width: 0;
    transition: background-color .35s ease;
  }
  .tab {
    flex: 1;
    min-height: 48px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    font-weight: 700;
    font-size: 15px;
    color: var(--muted);
    padding: 0 4px;
    transition: background-color .25s ease, color .25s ease, transform .1s ease;
    white-space: nowrap;
  }
  .tab:active { transform: scale(.96); }
  .tab[aria-selected="true"] { color: var(--tab-on); box-shadow: var(--shadow); }
  .tab[data-level="facile"][aria-selected="true"] { background: var(--easy); }
  .tab[data-level="moyen"][aria-selected="true"] { background: var(--medium); }
  .tab[data-level="difficile"][aria-selected="true"] { background: var(--hard); }

  .icon-btn {
    width: 48px; height: 48px;
    flex: none;
    border: 0;
    border-radius: 14px;
    background: var(--surface-2);
    font-size: 22px;
    display: grid; place-items: center;
    transition: background-color .35s ease, transform .1s ease;
  }
  .icon-btn:active { transform: scale(.92); }

  /* ---------- Centre ---------- */
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 20px 16px;
    text-align: center;
    position: relative;
    transition: background-color .35s ease, box-shadow .35s ease;
    overflow: hidden;
    isolation: isolate;
  }
  .level-badge {
    position: absolute; top: 14px; left: 0; right: 0;
    font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .word {
    position: relative;
    font-size: clamp(46px, 15vw, 104px);
    font-weight: 800;
    line-height: 1.1;
    margin: 0;
    overflow-wrap: anywhere;
    hyphens: auto;
    max-width: 100%;
  }
  .word.placeholder { font-size: clamp(22px, 6vw, 30px); font-weight: 600; color: var(--muted); }
  .word.pop { animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .remaining {
    position: absolute; bottom: 12px; left: 0; right: 0;
    font-size: 14px; color: var(--muted);
  }
  .done-box { display: none; flex-direction: column; align-items: center; gap: 14px; }
  .done-box p { margin: 0; font-size: 20px; font-weight: 700; }
  .done-box .sub { font-size: 16px; font-weight: 400; color: var(--muted); }
  .stage.done .word { display: none; }
  .stage.done .done-box { display: flex; }

  /* ---------- Bas ---------- */
  .bottom { display: flex; flex-direction: column; gap: 10px; }
  .timer-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .play-btn {
    flex: none; width: 52px; height: 52px; border: 0; border-radius: 50%;
    background: var(--surface-2); color: var(--text);
    display: grid; place-items: center;
    transition: transform .1s ease, background-color .25s ease;
  }
  .play-btn:active { transform: scale(.92); }
  .timer {
    flex: none;
    cursor: pointer;
    touch-action: manipulation;
    font-size: clamp(56px, 20vw, 88px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: center;
    line-height: 1;
    transition: color .3s ease;
  }
  .timer.warn { color: var(--danger); }
  .timer.paused { opacity: .45; }
  .timer.warn.running { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .btn {
    min-height: 48px;
    border: 0;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    padding: 0 18px;
    transition: background-color .25s ease, color .25s ease, transform .1s ease, opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #ffffff; color: #1f1c1c; }
  .btn-accent { background: var(--accent); color: var(--accent-text); }
  .btn-soft { background: var(--surface-2); color: var(--text); }
  .btn-danger { background: var(--danger); color: #1f1c1c; }

  .controls { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .btn-big { min-height: 52px; font-size: 19px; width: 100%; }

  /* ---------- Feuilles / dialogues ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(31, 28, 28, .45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .overlay.center { align-items: center; padding: 16px; }
  .sheet {
    width: 100%; max-width: 560px;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 16px max(20px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), background-color .35s ease;
    display: flex; flex-direction: column; gap: 18px;
  }
  .overlay.open .sheet { transform: none; }
  .dialog {
    width: 100%; max-width: 400px;
    background: var(--surface);
    border-radius: 24px;
    padding: 22px 18px 18px;
    transform: scale(.9);
    transition: transform .25s cubic-bezier(.2, 1.3, .4, 1);
    text-align: center;
  }
  .overlay.open .dialog { transform: none; }
  .dialog h2 { margin: 0 0 8px; font-size: 22px; }
  .dialog p { margin: 0 0 18px; color: var(--muted); font-size: 16px; line-height: 1.4; }
  .dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { margin: 0; font-size: 22px; }
  .label { font-weight: 700; margin-bottom: 8px; display: block; }
  .seg { display: flex; background: var(--surface-2); border-radius: 16px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; min-height: 48px; border: 0; border-radius: 12px; background: transparent;
    font-weight: 700; font-size: 17px; color: var(--muted);
    transition: background-color .25s ease, color .25s ease;
  }
  .seg button[aria-pressed="true"] { background: var(--easy); color: var(--tab-on); }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 56px; width: 100%;
    background: var(--surface-2); border: 0; border-radius: 16px; padding: 8px 14px;
    text-align: left;
    transition: opacity .2s ease, background-color .35s ease;
  }
  .switch-row .txt { display: flex; flex-direction: column; gap: 2px; }
  .switch-row .txt strong { font-size: 17px; }
  .switch-row .txt small { color: var(--muted); font-size: 14px; }
  .switch-row[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .knob {
    flex: none; width: 52px; height: 30px; border-radius: 999px;
    background: var(--border); position: relative; transition: background-color .25s ease;
  }
  .knob::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    transition: transform .25s ease;
  }
  .switch-row[aria-checked="true"] .knob { background: var(--green); }
  .switch-row[aria-checked="true"] .knob::after { transform: translateX(22px); }

  @media (max-height: 600px) {
    .timer { font-size: 52px; }
    .btn-big { min-height: 48px; font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="tabs" role="tablist" aria-label="Niveau">
      <button class="tab" role="tab" data-level="facile" aria-selected="true">Facile</button>
      <button class="tab" role="tab" data-level="moyen" aria-selected="false">Moyen</button>
      <button class="tab" role="tab" data-level="difficile" aria-selected="false">Difficile</button>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Réglages"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <main class="stage" id="stage" aria-live="polite">
    <p class="word placeholder" id="word">Appuie sur « Nouveau mot » pour commencer</p>
    <div class="done-box">
      <p>Tous les mots de ce niveau ont été joués !</p>
      <p class="sub">Choisis un autre niveau ou lance une nouvelle partie.</p>
      <button class="btn btn-primary" id="doneNewGame">Nouvelle partie</button>
    </div>
    <div class="remaining" id="remaining"></div>
  </main>

  <footer class="bottom">
    <div class="timer-row">
      <div class="timer" id="timer" role="timer" aria-live="off">1:00</div>
      <button class="play-btn" id="playBtn" aria-label="Démarrer"></button>
    </div>
    <button class="btn btn-primary btn-big" id="newWordBtn">Nouveau mot</button>
  </footer>
</div>

<!-- Réglages -->
<div class="overlay" id="settings" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-head">
      <h2 id="settingsTitle">Réglages</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Fermer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div>
      <span class="label">Durée du minuteur</span>
      <div class="seg" id="durationSeg">
        <button data-sec="30" aria-pressed="false">30 s</button>
        <button data-sec="60" aria-pressed="true">60 s</button>
        <button data-sec="90" aria-pressed="false">90 s</button>
      </div>
    </div>
    <button class="switch-row" id="wakeSwitch" role="switch" aria-checked="true">
      <span class="txt">
        <strong>Garder l'écran allumé</strong>
        <small id="wakeInfo">L'écran ne se mettra pas en veille</small>
      </span>
      <span class="knob" aria-hidden="true"></span>
    </button>
    <button class="btn btn-danger" id="newGameBtn">Nouvelle partie</button>
  </div>
</div>

<!-- Confirmation -->
<div class="overlay center" id="confirm" aria-hidden="true">
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <h2 id="confirmTitle">Nouvelle partie ?</h2>
    <p id="confirmText">Tous les mots déjà tirés pourront revenir, dans tous les niveaux. Le minuteur sera remis à zéro.</p>
    <div class="row">
      <button class="btn btn-soft" id="confirmNo">Annuler</button>
      <button class="btn btn-danger" id="confirmYes">Oui, on recommence</button>
    </div>
  </div>
</div>

      "invasion extraterrestre", "chasse au trésor", "salle d'attente", "crevaison", "égoportrait", "marche sur la lune", "soirée pyjama", "épluchette de blé d'Inde", "pique-nique sous la pluie", "orage",
      "avalanche", "tour de magie", "file d'attente", "ascenseur en panne", "voyage dans le temps", "déneigement", "rentrée scolaire", "sieste au soleil", "coup de soleil", "coup de foudre",
      "panne d'essence", "vente de garage", "mal de mer", "cauchemar", "réveille-matin qui sonne", "partie de cache-cache", "souper de famille", "bain moussant", "course de chevaux", "montagnes russes",
      "maison hantée", "réveillon de Noël"
    ]
  };
  var LEVEL_NAMES = { facile: "Facile", moyen: "Moyen", difficile: "Difficile" };

  /* ================= Stockage sûr ================= */
  var KEY = "pictionary-famille:"; // clé conservée pour garder l'historique
  function load(name, fallback) {
    try {
      var raw = localStorage.getItem(KEY + name);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function save(name, value) {
    try { localStorage.setItem(KEY + name, JSON.stringify(value)); } catch (e) { /* ignoré */ }
  }

  /* ================= État ================= */
  var seen = load("seen", {});
  if (!seen || typeof seen !== "object") seen = {};
  Object.keys(WORDS).forEach(function (lvl) { if (!Array.isArray(seen[lvl])) seen[lvl] = []; });

  var level = load("level", "facile");
  if (!WORDS[level]) level = "facile";
  var duration = load("duration", 60);
  if ([30, 60, 90].indexOf(duration) === -1) duration = 60;
  var wakeEnabled = load("wake", true) !== false;

  var $ = function (id) { return document.getElementById(id); };
  var wordEl = $("word"), stageEl = $("stage"), remainingEl = $("remaining");
  var timerEl = $("timer"), playBtn = $("playBtn");
  var ICON_PAUSE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  var ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';

  /* ================= Mots ================= */
  function remainingWords(lvl) {
    var s = seen[lvl];
    return WORDS[lvl].filter(function (w) { return s.indexOf(w) === -1; });
  }
  function updateRemaining() {
    var n = remainingWords(level).length;
    remainingEl.textContent = n + (n > 1 ? " mots restants" : " mot restant");
  }
  function showPlaceholder() {
    stageEl.classList.remove("done");
    wordEl.className = "word placeholder";
    wordEl.textContent = "Appuie sur « Nouveau mot » pour commencer";
  }
  function newWord() {
    var pool = remainingWords(level);
    resetTimer();
    if (pool.length === 0) {
      stageEl.classList.add("done");
      updateRemaining();
      return;
    }
    stageEl.classList.remove("done");
    var w = pool[Math.floor(Math.random() * pool.length)];
    seen[level].push(w);
    save("seen", seen);
    wordEl.className = "word";
    void wordEl.offsetWidth; // relance l'animation
    wordEl.className = "word pop";
    wordEl.textContent = w.charAt(0).toUpperCase() + w.slice(1);
    start();
    updateRemaining();
  }
  function setLevel(lvl) {
    level = lvl;
    save("level", lvl);
    document.querySelectorAll(".tab").forEach(function (t) {
      t.setAttribute("aria-selected", String(t.dataset.level === lvl));
    });
    showPlaceholder();
    resetTimer();
    updateRemaining();
  }
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { if (t.dataset.level !== level) setLevel(t.dataset.level); });
  });
  $("newWordBtn").addEventListener("click", function () { unlockAudio(); newWord(); });

  /* ================= Minuteur ================= */
  var remainingMs = duration * 1000, endAt = 0, tick = null, running = false;

  function fmt(ms) {
    var s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function renderTimer() {
    var s = Math.ceil(remainingMs / 1000);
    timerEl.textContent = fmt(remainingMs);
    timerEl.classList.toggle("warn", s <= 10);
    timerEl.classList.toggle("running", running);
    timerEl.classList.toggle("paused", !running && remainingMs > 0 && remainingMs < duration * 1000);
    playBtn.innerHTML = running ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute("aria-label", running ? "Pause" : "Démarrer");
  }
  function loop() {
    remainingMs = Math.max(0, endAt - Date.now());
    if (remainingMs <= 0) {
      stopTick();
      running = false;
      renderTimer();
      timeUp();
      return;
    }
    renderTimer();
  }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
  function start() {
    if (remainingMs <= 0) remainingMs = duration * 1000;
    unlockAudio();
    running = true;
    endAt = Date.now() + remainingMs;
    stopTick();
    tick = setInterval(loop, 200);
    renderTimer();
  }
  function pause() {
    remainingMs = Math.max(0, endAt - Date.now());
    running = false;
    stopTick();
    renderTimer();
  }
  function resetTimer() {
    running = false;
    stopTick();
    remainingMs = duration * 1000;
        renderTimer();
  }
  function toggleTimer() { running ? pause() : start(); }
  timerEl.addEventListener("click", toggleTimer);
  playBtn.addEventListener("click", function () { unlockAudio(); toggleTimer(); });

  function timeUp() {
    try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) {}
    beep();
  }

  /* ================= Son (Web Audio) ================= */
  var audioCtx = null;
  function unlockAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep() {
    try {
      unlockAudio();
      if (!audioCtx) return;
      var t0 = audioCtx.currentTime + 0.05;
      [0, 0.3, 0.6].forEach(function (offset, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = i === 2 ? 1046 : 880;
        var t = t0 + offset, len = i === 2 ? 0.45 : 0.2;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + len + 0.05);
      });
    } catch (e) {}
  }

  /* ================= Réglages ================= */
  var settingsEl = $("settings"), confirmEl = $("confirm");
  function openOverlay(el) { el.classList.add("open"); el.setAttribute("aria-hidden", "false"); }
  function closeOverlay(el) { el.classList.remove("open"); el.setAttribute("aria-hidden", "true"); }
  $("settingsBtn").addEventListener("click", function () { openOverlay(settingsEl); });
  $("closeSettings").addEventListener("click", function () { closeOverlay(settingsEl); });
  settingsEl.addEventListener("click", function (e) { if (e.target === settingsEl) closeOverlay(settingsEl); });
  confirmEl.addEventListener("click", function (e) { if (e.target === confirmEl) closeOverlay(confirmEl); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (confirmEl.classList.contains("open")) closeOverlay(confirmEl);
    else closeOverlay(settingsEl);
  });

  function renderDuration() {
    document.querySelectorAll("#durationSeg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.sec) === duration));
    });
  }
  document.querySelectorAll("#durationSeg button").forEach(function (b) {
    b.addEventListener("click", function () {
      duration = Number(b.dataset.sec);
      save("duration", duration);
      renderDuration();
      resetTimer();
    });
  });

  /* Nouvelle partie */
  function askNewGame() { closeOverlay(settingsEl); openOverlay(confirmEl); $("confirmNo").focus(); }
  $("newGameBtn").addEventListener("click", askNewGame);
  $("doneNewGame").addEventListener("click", askNewGame);
  $("confirmNo").addEventListener("click", function () { closeOverlay(confirmEl); });
  $("confirmYes").addEventListener("click", function () {
    Object.keys(WORDS).forEach(function (lvl) { seen[lvl] = []; });
    save("seen", seen);
    closeOverlay(confirmEl);
    showPlaceholder();
    resetTimer();
    updateRemaining();
  });

  /* ================= Écran allumé (Wake Lock) ================= */
  var wakeSwitch = $("wakeSwitch"), wakeInfo = $("wakeInfo");
  var wakeSupported = "wakeLock" in navigator && navigator.wakeLock && typeof navigator.wakeLock.request === "function";
  var wakeLock = null;

  function requestWake() {
    if (!wakeSupported || !wakeEnabled || document.visibilityState !== "visible" || wakeLock) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      lock.addEventListener("release", function () { wakeLock = null; });
      if (!wakeEnabled) releaseWake();
    }).catch(function () { wakeLock = null; });
  }
  function releaseWake() {
    if (wakeLock) { var l = wakeLock; wakeLock = null; l.release().catch(function () {}); }
  }
  function renderWake() {
    if (!wakeSupported) {
      wakeSwitch.setAttribute("aria-disabled", "true");
      wakeSwitch.setAttribute("aria-checked", "false");
      wakeInfo.textContent = "Non supporté sur cet appareil";
      return;
    }
    wakeSwitch.setAttribute("aria-checked", String(wakeEnabled));
    wakeInfo.textContent = wakeEnabled ? "L'écran ne se mettra pas en veille" : "L'écran peut se mettre en veille";
  }
  wakeSwitch.addEventListener("click", function () {
    if (!wakeSupported) return;
    wakeEnabled = !wakeEnabled;
    save("wake", wakeEnabled);
    renderWake();
    if (wakeEnabled) requestWake(); else releaseWake();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      requestWake();
      if (running) loop(); // rattrape le temps écoulé
    }
  });
  // Certains navigateurs exigent un geste : on réessaie au premier toucher.
  document.addEventListener("pointerdown", requestWake, { passive: true });

  /* ================= Démarrage ================= */
  renderDuration();
  renderWake();
  setLevel(level);
  requestWake();
})();
</script>
</body>
</html>
